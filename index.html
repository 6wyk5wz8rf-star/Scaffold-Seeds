<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#f3f0e8">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scaffold Seeds">
  <meta name="description" content="Scaffold Seeds helps primary teachers in England design temporary supports that preserve challenge and grow independence.">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/scaffold-seeds.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/scaffold-seeds-apple-touch.png" sizes="180x180">

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" role="img"><path d="M18 29V16M18 22c-5.5 0-9-3.3-9-8.5 5.5-.6 9 2.4 9 8.5ZM18 18c0-5.4 3.4-8.6 9-8.5 0 5.3-3.5 8.5-9 8.5Z"/></svg>
        </span>
        <span><strong>Scaffold</strong><em>Seeds</em></span>
      </div>

      <nav class="nav-list" id="primary-nav">
        <button type="button" class="nav-item is-active" data-view="home" aria-current="page">
          <span data-icon="home" aria-hidden="true"></span><span>Home</span>
        </button>
        <button type="button" class="nav-item" data-view="library">
          <span data-icon="library" aria-hidden="true"></span><span>Library</span>
        </button>
      </nav>

      <details class="sidebar-tools">
        <summary>Reference &amp; preferences</summary>
        <button type="button" data-view="knowledge"><span data-icon="knowledge" aria-hidden="true"></span>Curriculum reference</button>
        <button type="button" data-view="settings"><span data-icon="settings" aria-hidden="true"></span>Preferences &amp; backup</button>
      </details>
    </aside>

    <div class="app-column">
      <header class="topbar">
        <button type="button" class="icon-button menu-button" id="menu-button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <span data-icon="menu" aria-hidden="true"></span>
        </button>
        <div class="topbar-title">
          <span class="eyebrow" id="section-kicker">Your thinking space</span>
          <h1 id="section-title">Home</h1>
        </div>
        <div class="topbar-actions">
          <span class="local-status" id="save-status" aria-live="polite"><span></span><b>Saved</b></span>
        </div>
      </header>

      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
  <div class="modal-layer" id="modal-layer" hidden></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="print-root" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="build3-data.js"></script>
  <script src="build4-data.js"></script>
  <script src="build5-data.js"></script>
  <script src="resource-engine.js"></script>
  <script src="verification-engine.js"></script>
  <script src="ai-companion.js"></script>
  <script src="persistence.js"></script>
  <script src="app.js"></script>
